name: Release

# 打 tag（v1.0.0 / v1.0.0-beta.1）即自动构建并发布 Release。
# 只走 tag 触发，不给 push/PR 增加构建量。
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 tag（如 v1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK exists
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "❌ 没有找到 APK 产物"
            exit 1
          fi
          echo "✅ APK: $APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 签名在 release notes 里的校验值，方便下载后自行核对
      - name: Compute checksums
        run: |
          set -e
          APK_NAME="IceGuard-${{ steps.tag.outputs.name }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: IceGuard ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            IceGuard-${{ steps.tag.outputs.name }}.apk
            IceGuard-${{ steps.tag.outputs.name }}.apk.sha256
